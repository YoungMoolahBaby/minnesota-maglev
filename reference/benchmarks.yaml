  # ===== Research pass 3 (2026-11-04): guideway civil costs =====
  # Conventional HSR viaducts as comparators (maglev data is thin), US urban viaducts, a Minnesota
  # bottom-up check, and the maglev-specific figures pass 3 turned up. FX: Fed G.5A annual averages.
  - id: hs2_viaduct_target
    param: costs.guideway.elevated
    value: 23
    currency: GBP
    year: 2015
    unit: MUSD/km
    scope: HS2 (UK) viaducts, benchmarked target cost per km in the Phase 2 savings plan, 2015 prices; double-track HSR viaduct, what is included (risk, design) not stated
    source: Cabinet Secretary 2016 HS2 Phase 2 report, https://www.gov.uk/government/publications/cabinet-secretary-2016-hs2-phase-1-and-2-reports/cabinet-secretary-2016-hs2-phase-2-report-html
    quote: "For viaducts this means building at £23m per km rather than the originally budgeted cost of £32m per km"
