# Capital and operating cost parameters. Money in USD millions (MUSD), 2026 dollars.
# Every leaf: value (most likely), low/high (the range Monte Carlo samples, triangular),
# unit, conf (high | medium | low | placeholder), source, note.
# "placeholder" = an engineering guess waiting for research (see docs/RESEARCH.md).
#
# Civil and systems costs are BEFORE soft costs and contingency (the model adds those).
# Research pass 1 (2026-11-03): the sourced figures behind guideway, systems, urban, tunnel and
# bridge costs are in reference/benchmarks.yaml, converted to 2026 USD with the FHWA highway
# construction index (`uv run mnmaglev benchmarks`). Each range covers its anchor benchmarks
# (tests/test_benchmarks.py). Converting with CPI instead of a construction index would give
# ~25-40% lower values for older figures; the low ends allow for that.
# Research pass 3 (2026-11-04): guideway civil costs against conventional HSR viaducts (HS2, Texas
# Central, CA HSR, China, India), US urban viaducts and Minnesota bridge unit costs.

guideway:
  elevated:
    value: 75
    low: 45
    high: 120
    unit: MUSD/km
    conf: "low"
    source: "benchmarks (2026 USD; pass 3 2026-11-04): maglev: Transrapid Munich itemised ~60 (Vieregg-Rössler 2007, net of planning/contingency), FRA 2005 Pittsburgh guideway ~79, SCMaglev DEIS viaduct ~76, Pittsburgh promoter 2001 ~81; conventional HSR viaduct: HS2 target 65 / budget 90 (GBP 23-32 M/km, 2015), Texas Central civil ~64 per km averaged over a route half on viaduct (so its viaduct costs more); a 1998 Chinese delegation put maglev line works 20-32% above HSR in the plains (advocate's account, low confidence). Anchor median ~77; Minnesota bridges cost about half the US state average (FHWA 2025: $208 vs $393/ft2), so the value sits a little below it. Context, not US prices: China HSR viaduct ~23, India ~18; a plain Minnesota highway-type 12.5 m deck ~27 (maglev beams carry precision and stator mounts on top)"
    note: dual-track concrete or hybrid beams on piers, rural. The default for Minnesota (snow, drifting, farm and wildlife crossings).
  at_grade:
    value: 60
    low: 36
    high: 95
    unit: MUSD/km
    conf: "low"
    source: "Transrapid Munich at-grade ~50 (2026 USD); elevated/at-grade superstructure ratio 1.22-1.26 (two German derivations) applied to the elevated value (75 / 1.24; pass 3 2026-11-04)"
    note: beams on low piers or a slab; needs snow clearance under the vehicle skirt and fencing.
  urban_viaduct:
    value: 150
    low: 90
    high: 280
    unit: MUSD/km
    conf: low
    source: "Honolulu guideway contracts ~139 (2026 USD, suburban medians, light metro), CA HSR viaduct ~174 (city estimate), CA HSR San Jose approach unit prices 157 (20 ft piers) and 176 (40 ft piers) with their 15% allocated contingency removed (Q4 2021, pass 3); heavier maglev structure, utility relocation, traffic staging. Whole urban lines incl. stations run ~210-450 (Sound Transit Lynnwood L300 ~211)"
  tunnel:
    value: 500
    low: 280
    high: 1000
    unit: MUSD/km
    conf: low
    source: "Hudson tunnel package 1C ~584 (2026, civil only, subaqueous, top end), CA HSR Palmdale-Burbank structures <= ~545 (2026 USD ceiling); US transit tunnel lines incl. stations median ~1,088 (Transit Costs Project)"
    note: only where nothing else works (downtown approaches); maglev needs a large bore for 400+ km/h.
  bridge_per_m:
    value: 0.40
    low: 0.22
    high: 0.75
    unit: MUSD/m
    conf: low
    source: "Minnesota river bridges in 2026 USD: St. Croix Crossing ~0.47, Hastings ~0.42 (4-lane highway decks, ~$19-24k per m2); a dual maglev deck is narrower (~12-13 m) but heavier-spec. I-35W (~1.28, 10 lanes, emergency) is context only"
  pier_height_ref:
    value: 20
    low: 12
    high: 25
    unit: m
    conf: "low"
    source: "Transrapid Shanghai design classes: at-grade guideway 1.25-3.5 m and elevated 3.5-20 m gradient height (standard beams and piers; Berlin-Hamburg planned one girder type for 2.2-20 m); a 1992 FRA study costed Transrapid guideway on 7.6 m piers. The elevated benchmarks are lines of such standard piers, so the elevated price is taken to cover piers up to about this height"
    note: guideway standing higher above the ground (GIS-measured ravine and valley crossings within the 10% grade limit) pays tall_pier_per_m for every metre above it
  tall_pier_per_m:
    value: 0.6
    low: 0.3
    high: 1.2
    unit: MUSD/km/m
    conf: "placeholder"
    source: "engineering estimate, not a benchmark: 32-40 double-track piers per km (24.8-31 m Transrapid beams); a tall hollow pier for a double-track maglev deck takes ~8-12 m3 of concrete per metre of height at ~$1,500-2,500/m3 in place (slipform, rebar), ~$12-30k per pier-metre, plus deeper foundations; over deep ravines longer spans trade fewer piers for dearer beams"
    note: at 70 m (50 m above the reference) elevated guideway costs ~1.5x (1.2-1.9x across the range)
  switch_each:
    value: 7
    low: 4
    high: 15
    unit: MUSD
    conf: "low"
    source: "Berlin-Hamburg planning: ~2 Mio DM per maglev switch (1993; ~10x a rail switch of the same length) = ~4.8 M 2026 USD (benchmarks); high end for heating and planners' underestimates (VR found 45-76% elsewhere)"

systems:
  propulsion_power_control:
    value: 21
    low: 10
    high: 40
    unit: MUSD/km
    conf: "medium"
    source: "research pass 4 (2026-11-05), reference/benchmarks.yaml, 2026 USD per route-km of dual guideway, contingency removed where stated: Berlin-Hamburg planning company itemised 20.7, Transrapid International unit prices (Pittsburgh 1991) 19.6, FRA 2005 Anaheim-Ontario 19.1, Baltimore-Washington 26.7, Munich 33.8, Pittsburgh 11.3; Vieregg-Rössler Munich 20.2 with their doubled power line halved back. Median ~20; set a little above it because the one built line (Shanghai, Siemens share without the stator ~31) ran higher. Conventional HSR systems 3.5-9 (floor). Bottom-up: ~11 hardware, 15-19 with installation"
    note: the long stator lives in the guideway, so this scales with km, not with trains. Short airport links (Munich, Baltimore-Washington, Shanghai) carry the fixed items over few km; the Minnesota lines are 100-1,400 km.

adders:
  highway_corridor:
    value: 0.05
    low: 0.02
    high: 0.12
    unit: fraction of guideway cost on km beside a freeway
    conf: placeholder
    source: "pier crash protection and barriers next to traffic (AASHTO LRFD pier protection), lane closures and traffic control while building, highway authority review; offset by existing access for construction"
  floodplain:
    value: 0.15
    low: 0.05
    high: 0.35
    unit: fraction of guideway cost on floodplain km
    conf: placeholder
    source: taller piers above the climate-adjusted 500-yr flood + freeboard, scour protection
  frost_north:
    value: 0.05
    low: 0.02
    high: 0.10
    unit: fraction of guideway cost
    conf: placeholder
    source: deeper pier foundations; MN Rules 1303.1600 frost zones (north ~60 in vs south ~42 in, verify)
  frost_south:
    value: 0.02
    low: 0.01
    high: 0.05
    unit: fraction of guideway cost
    conf: placeholder
    source: as frost_north
  peat_soft_ground:
    value: 0.20
    low: 0.08
    high: 0.45
    unit: fraction of guideway cost on peat/soft-ground km
    conf: placeholder
    source: deep piles through peat (Shanghai was built on very soft soil and needed extensive piling)

stations:
  terminal_major:
    value: 420
    low: 200
    high: 900
    unit: MUSD each
    conf: "low"
    source: "FRA 2005 Baltimore-Washington station ~418 (2026 USD); St. Paul Union Depot renovation incl. land ~476; CA HSR Central Valley stations ~287 each (2024 BoE, YOE)"
  airport:
    value: 280
    low: 120
    high: 650
    unit: MUSD each
    conf: "low"
    source: "between the FRA 2005 terminal (~418) and city-station figures; Orlando airport intermodal terminal ($684 M incl. garage, unconfirmed) as context"
  city:
    value: 180
    low: 70
    high: 350
    unit: MUSD each
    conf: "low"
    source: "2026 USD: CA HSR Central Valley stations ~287 (YOE), FRA 2005 Pittsburgh ~239 and Anaheim ~132, Berlin-Hamburg 50 Mio DM ~120, Brightline Boca Raton ~68 (floor)"
  switches_per_station:
    value: 4
    low: 2
    high: 6
    unit: count
    conf: low
    source: passing tracks at stations

depot:
  per_line:
    value: 350
    low: 100
    high: 700
    unit: MUSD
    conf: "low"
    source: "CA HSR heavy maintenance facility ~640 (2024 BoE, YOE; light facility ~364), Berlin-Hamburg vehicle works 150 Mio DM ~360, Brightline Orlando VMF ~104 (2026 USD)"

vehicles:
  per_section:
    value: 32
    low: 22
    high: 48
    unit: MUSD
    conf: "medium"
    source: "2026 USD: FRA 2005 per section Baltimore-Washington ~37, Pittsburgh ~27, Munich ~42; Transrapid Australia 2008 ~29; Berlin-Hamburg 9.5 Mio DM ~23; high end for US tariffs (~20%, CA HSR Siemens contract 2026) and a first-batch premium"
  sections_per_train:
    value: 5
    low: 5
    high: 5
    unit: count
    conf: medium
    source: design choice (Shanghai runs up to 5 sections, 440 seats max)
  spare_ratio:
    value: 0.2
    low: 0.15
    high: 0.3
    unit: fraction
    conf: medium
    source: typical fleet spare margin

soft:
  engineering_admin:
    value: 0.24
    low: 0.18
    high: 0.35
    unit: fraction of construction
    conf: medium
    source: "MnDOT MWRRI cost method (Quandel 2011): design 10 + insurance/bonding 2 + program mgmt 4 + construction mgmt 6 + engineering during construction 2 = 24%; TCRP 138 (59 US rail projects) ~20% of capital, 11-54% of construction"
  contingency:
    value: 0.19
    low: -0.30
    high: 4.0
    quantiles: {0.0: -0.30, 0.05: -0.15, 0.30: 0.0, 0.50: 0.19, 0.80: 1.21, 0.95: 2.71, 1.0: 4.0}
    unit: fraction of construction + soft + land (cost growth over the base estimate, sampled along a reference-class curve)
    conf: medium
    source: "research pass 5 (2026-11-05): rail reference class at the earliest business-case stage (Oxford Global Projects for DfT, 2020, Table 5: rail n=355, 1964-2011, SOBC: median 19%, P80 121%, trimmed P5-P95 mean 56%; 7 in 10 projects overran, Table 2), the basis of UK TAG A1.2's 56% rail uplift at stage 1. Curve: P30 0 and P50 / P80 as published; P95 2.71 solved so the P5-P95 mean is 56%; P0 -0.30, P5 -0.15 and P100 4.0 are our assumptions. Full mean ~66%, P65 ~70%, P90 ~221%. Cross-checks: FTA 2020 (29 US projects, actual vs estimate at entry to preliminary engineering, YOE): median 1.18, mean 1.54, P80 1.68; FTA OP-40 minimum contingency 40% at 15% design (P65); Flyvbjerg (2006) rail uplift 40% at P50, 57% at P80 from the decision to build (n=46)"
    note: one draw per Monte Carlo sample applies to every line (shared estimating bias, conservative for the network total). Our base is a concept-stage estimate, earlier than an SOBC, and built mostly from other projects' estimates, so the curve applies to it; the few unit costs taken from out-turns already carry their growth. Was a flat 40% (triangular 30-70%) before pass 5.
  first_of_kind:
    value: 0.5
    low: 0.1
    high: 1.3
    unit: extra cost growth on the maglev-specific items (systems, vehicles, switches incl. soft costs), added to the contingency
    conf: low
    source: "UK TAG A5.3 (Nov 2025): novel or complex schemes may take higher uplifts, 'a 120% uplift at PACE stage 1 provides a starting point' for complex enhancements vs 56% standard (+64 points); HM Treasury Green Book optimism bias, Table 1 (Mott MacDonald 2002, at outline business case): equipment/development upper bound 200% vs non-standard civil 66%, and equipment/development elements 'should be considered as separate projects'; RAND R-2569 (Merrow et al. 1981): the earliest estimates for pioneer plants averaged under half of actual cost. Against: Shanghai, with its systems a fixed German package, grew only 12% overall (initial budget RMB 8.9 bn, final account 9.943 bn; no cause published), and Chuo's growth (5.52 -> 11.0 trillion yen) came from ground, seismic design, spoil and prices, with specification changes (incl. electrical) +0.4 of +5.5"
    note: full on phase 1, scaled by first_of_kind_later on later phases. Fusion units are not in it (power.fusion.capex_per_kw carries their range).
  first_of_kind_later:
    value: 0.3
    low: 0.1
    high: 0.7
    unit: share of the first-of-kind premium left on lines after phase 1
    conf: placeholder
    source: "RAND R-2569 regression: poor project definition costs ~6.4 points per level while the technology is still in development vs ~4.0 once proven, so the premium should shrink once phase 1 runs; no rail or maglev data on later lines of a new technology. Later European HSR lines in mature networks still overran 26-38% nominal (ECA 19/2018), which the contingency curve covers"

operations:
  energy_price:
    value: 0.1
    low: 0.09
    high: 0.135
    unit: USD/kWh
    conf: "medium"
    source: "EIA Electric Power Monthly table 5.6.B: Minnesota industrial 9.78 c/kWh Jan-Aug 2026 (9.26 in 2025); transportation sector 13.51 c (high end); Transrapid peak demand 2-3x rail implies demand charges"
  per_train_km:
    value: 0
    low: 0
    high: 0
    unit: USD per train-km (operating cost charged per train-km; 0 for maglev, whose O&M is per route-km, staff and energy)
    conf: high
    source: "model switch for the technology comparison: upgraded conventional rail is costed like Amtrak state-supported routes, per train-mile (params/technology.yaml)"
  om_per_km_year:
    value: 0.6
    low: 0.35
    high: 1.0
    unit: MUSD/km/year
    conf: "low"
    source: "FRA 2005 project O&M: Baltimore-Washington $53 M/yr for 40 mi (~0.82 M/route-km, 2020$), Pittsburgh $37.3 M/yr for 47 mi (~0.49, 2012$), energy ~28% of that; CA HSR 0.91-1.19 M/route-km (2015$, all-in); Berlin-Hamburg 0.83-1.29 Mio DM/km/yr (1993, all-in). Net of energy and crews ~0.5-0.8"
  winter_per_km_year:
    value: 0.05
    low: 0.02
    high: 0.12
    unit: MUSD/km/year
    conf: "placeholder"
    source: "no per-km figure found. Emsland test track: snow does not stay on the elevated guideway and blows off; the stator sits under the deck; caked snow over 15 cm or icing after a night pause is cleared with a clearing vehicle (Bundestag Drs. 11/2488, 1988). Swedish switch heating ~EUR 800 per switch-year"
  staff_per_train_year:
    value: 2.5
    low: 1.5
    high: 4.0
    unit: MUSD/train/year
    conf: "low"
    source: "Berlin-Hamburg train formation and operation 26-37 Mio DM/yr for 15-19 trains (~1.4-2.5 Mio DM per train-year, 1993); CA HSR train operations $285 M/yr for 78 trainsets (~3.65 M, 2015$, incl. energy)"

# Build-for-two provisions when a line reserves room for a second system (see land.yaml reserve).
reserve:
  urban_provision:
    value: 0.30
    low: 0.15
    high: 0.60
    unit: fraction of urban viaduct + tunnel cost
    conf: placeholder
    source: footings and foundations for a second viaduct, or tunnel boxes and portals sized for two, built now because they can't be added beside a live line in a city
  bridge_provision:
    value: 0.15
    low: 0.05
    high: 0.40
    unit: fraction of long-bridge cost
    conf: placeholder
    source: second-span foundations in the river, or at least permits and land for them
  station_provision:
    value: 0.25
    low: 0.10
    high: 0.50
    unit: fraction of station cost
    conf: placeholder
    source: platforms, land and structure for system B at each station (the Midway hub above all)
  review_extra:
    value: 0.005
    low: 0.002
    high: 0.015
    unit: fraction of construction
    conf: placeholder
    source: environmental review, design and agreements covering the reserved strip now, so it is protected

# Local supply policy (network/lines.yaml settings.local_supply): Minnesota-made beams and stator
# packs, taconite tailings as aggregate near the Range, long-term supply contracts with Minnesota
# mines and mills. Savings are relative to the benchmark costs; the report shows them either way.
local_supply:
  beam_plant_saving:
    value: 0.015
    low: 0.0
    high: 0.04
    unit: fraction of elevated + at-grade guideway civil cost
    conf: placeholder
    source: "one guideway-beam plant in Minnesota for the whole network (Shanghai built a dedicated girder factory, per Shanghai Maglev patents US7182023/US7357084); saving = shorter hauls of ~25 m beams and one plant amortised over every phase and the sibling system. Benchmarks likely already assume a plant near the line, hence small"
  stator_plant_saving:
    value: 0.01
    low: 0.0
    high: 0.03
    unit: fraction of propulsion/power/control cost
    conf: placeholder
    source: stator-pack assembly in Minnesota (Iron Range or Duluth) near the electrical-steel supply chain; logistics and quality control
  tailings_share:
    value: 0.5
    low: 0.2
    high: 0.8
    unit: share of concrete aggregate replaced by taconite aggregate/tailings on north-zone segments
    conf: placeholder
    source: "MnDOT/NRRI: taconite aggregates performed as well or better in MnROAD test sections incl. concrete (Cell 54, 2004), used for decades near the mines; MnDOT notes limited information for design specifications"
  tailings_saving_per_t:
    value: 2
    low: -4
    high: 8
    unit: "USD/t of aggregate replaced (can be negative: hauling from the Range can cost more than local gravel)"
    conf: placeholder
    source: tailings are a mine by-product near the Range; saving depends on haul distance vs local gravel pits
  contingency_points:
    value: 0.01
    low: 0.0
    high: 0.02
    unit: contingency fraction removed
    conf: placeholder
    source: "long-term fixed-price contracts for steel, concrete and stator materials hedge price spikes like 2021-22; materials are only a few % of cost, so the hedge is worth ~1 point"
