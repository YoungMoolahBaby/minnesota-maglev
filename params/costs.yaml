# Capital and operating cost parameters. Money in USD millions (MUSD), 2026 dollars.
# Every leaf: value (most likely), low/high (the range Monte Carlo samples, triangular),
# unit, conf (high | medium | low | placeholder), source, note.
# "placeholder" = an engineering guess waiting for research (see docs/RESEARCH.md).
#
# Civil and systems costs are BEFORE soft costs and contingency (the model adds those).
# Research pass 1 (2026-11-03): the sourced figures behind guideway, systems, urban, tunnel and
# bridge costs are in reference/benchmarks.yaml, converted to 2026 USD with the FHWA highway
# construction index (`uv run mnmaglev benchmarks`). Each range covers its anchor benchmarks
# (tests/test_benchmarks.py). Converting with CPI instead of a construction index would give
# ~25-40% lower values for older figures; the low ends allow for that.

guideway:
  elevated:
    value: 60
    low: 40
    high: 95
    unit: MUSD/km
    conf: low
    source: "benchmarks (2026 USD): Transrapid Munich itemised estimate ~60 (Vieregg-Rössler 2007, net of planning/contingency), SCMaglev DEIS viaduct ~76 (tall, suburban), Pittsburgh maglev 2001 ~77 (promoter, likely incl. stator)"
    note: dual-track concrete or hybrid beams on piers, rural. The default for Minnesota (snow, drifting, farm and wildlife crossings).
  at_grade:
    value: 48
    low: 32
    high: 78
    unit: MUSD/km
    conf: low
    source: "Transrapid Munich at-grade ~50 (2026 USD, benchmarks); elevated/at-grade superstructure ratio 1.22-1.26 in two German derivations, because 'at grade' Transrapid is still a beam on low piers"
    note: beams on low piers or a slab; needs snow clearance under the vehicle skirt and fencing.
  urban_viaduct:
    value: 150
    low: 90
    high: 280
    unit: MUSD/km
    conf: low
    source: "Honolulu guideway contracts ~139 (2026 USD, suburban medians, light metro), CA HSR viaduct ~174 (city estimate); heavier maglev structure, utility relocation, traffic staging. Whole urban lines incl. stations run ~220-450"
  tunnel:
    value: 500
    low: 280
    high: 1000
    unit: MUSD/km
    conf: low
    source: "Hudson tunnel package 1C ~584 (2026, civil only, subaqueous, top end), CA HSR Palmdale-Burbank structures <= ~545 (2026 USD ceiling); US transit tunnel lines incl. stations median ~1,088 (Transit Costs Project)"
    note: only where nothing else works (downtown approaches); maglev needs a large bore for 400+ km/h.
  bridge_per_m:
    value: 0.40
    low: 0.22
    high: 0.75
    unit: MUSD/m
    conf: low
    source: "Minnesota river bridges in 2026 USD: St. Croix Crossing ~0.47, Hastings ~0.42 (4-lane highway decks, ~$19-24k per m2); a dual maglev deck is narrower (~12-13 m) but heavier-spec. I-35W (~1.28, 10 lanes, emergency) is context only"
  switch_each:
    value: 15
    low: 8
    high: 30
    unit: MUSD
    conf: placeholder
    source: steel bending-beam maglev switch, heated for Minnesota winters

systems:
  propulsion_power_control:
    value: 27
    low: 17
    high: 45
    unit: MUSD/km
    conf: low
    source: "long stator (iron packs + windings), substations and feeders, operations control, comms. Transrapid Munich itemised ~27 (2026 USD, benchmarks; critic doubled the study's power cost); official Berlin-Hamburg planning puts systems at ~0.57x civil guideway (0.57 x 60 = 34)"
    note: the long stator lives in the guideway, so this scales with km, not with trains.

adders:
  floodplain:
    value: 0.15
    low: 0.05
    high: 0.35
    unit: fraction of guideway cost on floodplain km
    conf: placeholder
    source: taller piers above the climate-adjusted 500-yr flood + freeboard, scour protection
  frost_north:
    value: 0.05
    low: 0.02
    high: 0.10
    unit: fraction of guideway cost
    conf: placeholder
    source: deeper pier foundations; MN Rules 1303.1600 frost zones (north ~60 in vs south ~42 in, verify)
  frost_south:
    value: 0.02
    low: 0.01
    high: 0.05
    unit: fraction of guideway cost
    conf: placeholder
    source: as frost_north
  peat_soft_ground:
    value: 0.20
    low: 0.08
    high: 0.45
    unit: fraction of guideway cost on peat/soft-ground km
    conf: placeholder
    source: deep piles through peat (Shanghai was built on very soft soil and needed extensive piling)

stations:
  terminal_major:
    value: 450
    low: 200
    high: 1000
    unit: MUSD each
    conf: placeholder
    source: downtown terminal incl. approach, platforms for 5-section trains, transit connections
  airport:
    value: 280
    low: 120
    high: 650
    unit: MUSD each
    conf: placeholder
    source: engineering guess
  city:
    value: 130
    low: 60
    high: 300
    unit: MUSD each
    conf: placeholder
    source: engineering guess
  switches_per_station:
    value: 4
    low: 2
    high: 6
    unit: count
    conf: low
    source: passing tracks at stations

depot:
  per_line:
    value: 300
    low: 150
    high: 650
    unit: MUSD
    conf: placeholder
    source: maintenance and storage facility, one per line, winter-proofed (indoor storage)

vehicles:
  per_section:
    value: 28
    low: 20
    high: 40
    unit: MUSD
    conf: low
    source: Transrapid Australia 2008 quote A$16.5-20 M per section, inflated, US build + winterisation
  sections_per_train:
    value: 5
    low: 5
    high: 5
    unit: count
    conf: medium
    source: design choice (Shanghai runs up to 5 sections, 440 seats max)
  spare_ratio:
    value: 0.2
    low: 0.15
    high: 0.3
    unit: fraction
    conf: medium
    source: typical fleet spare margin

soft:
  engineering_admin:
    value: 0.24
    low: 0.18
    high: 0.35
    unit: fraction of construction
    conf: medium
    source: "MnDOT MWRRI cost method (Quandel 2011): design 10 + insurance/bonding 2 + program mgmt 4 + construction mgmt 6 + engineering during construction 2 = 24%; TCRP 138 (59 US rail projects) ~20% of capital, 11-54% of construction"
  contingency:
    value: 0.40
    low: 0.30
    high: 0.70
    unit: fraction of construction + soft
    conf: medium
    source: "AACE 18R-97 class 5 (-20..-50% / +30..+100%); MnDOT MWRRI uses 30% of direct construction; rail projects overran 44.7% on average (Flyvbjerg, Holm & Buhl 2003, SD 38, n=58); FTA/FRA fund to P65"

operations:
  energy_price:
    value: 0.10
    low: 0.07
    high: 0.15
    unit: USD/kWh
    conf: low
    source: Minnesota industrial rates, placeholder until a tariff is checked
  om_per_km_year:
    value: 0.6
    low: 0.35
    high: 1.0
    unit: MUSD/km/year
    conf: placeholder
    source: guideway, stator and systems maintenance; maglev has no wheel/rail wear
  winter_per_km_year:
    value: 0.05
    low: 0.02
    high: 0.12
    unit: MUSD/km/year
    conf: placeholder
    source: snow and ice clearing, switch heating, inspection after ice storms
  staff_per_train_year:
    value: 1.5
    low: 1.0
    high: 2.5
    unit: MUSD/train/year
    conf: placeholder
    source: crews, cleaning, station staff share

# Build-for-two provisions when a line reserves room for a second system (see land.yaml reserve).
reserve:
  urban_provision:
    value: 0.30
    low: 0.15
    high: 0.60
    unit: fraction of urban viaduct + tunnel cost
    conf: placeholder
    source: footings and foundations for a second viaduct, or tunnel boxes and portals sized for two, built now because they can't be added beside a live line in a city
  bridge_provision:
    value: 0.15
    low: 0.05
    high: 0.40
    unit: fraction of long-bridge cost
    conf: placeholder
    source: second-span foundations in the river, or at least permits and land for them
  station_provision:
    value: 0.25
    low: 0.10
    high: 0.50
    unit: fraction of station cost
    conf: placeholder
    source: platforms, land and structure for system B at each station (the Midway hub above all)
  review_extra:
    value: 0.005
    low: 0.002
    high: 0.015
    unit: fraction of construction
    conf: placeholder
    source: environmental review, design and agreements covering the reserved strip now, so it is protected

# Local supply policy (network/lines.yaml settings.local_supply): Minnesota-made beams and stator
# packs, taconite tailings as aggregate near the Range, long-term supply contracts with Minnesota
# mines and mills. Savings are relative to the benchmark costs; the report shows them either way.
local_supply:
  beam_plant_saving:
    value: 0.015
    low: 0.0
    high: 0.04
    unit: fraction of elevated + at-grade guideway civil cost
    conf: placeholder
    source: "one guideway-beam plant in Minnesota for the whole network (Shanghai built a dedicated girder factory, per Shanghai Maglev patents US7182023/US7357084); saving = shorter hauls of ~25 m beams and one plant amortised over every phase and the sibling system. Benchmarks likely already assume a plant near the line, hence small"
  stator_plant_saving:
    value: 0.01
    low: 0.0
    high: 0.03
    unit: fraction of propulsion/power/control cost
    conf: placeholder
    source: stator-pack assembly in Minnesota (Iron Range or Duluth) near the electrical-steel supply chain; logistics and quality control
  tailings_share:
    value: 0.5
    low: 0.2
    high: 0.8
    unit: share of concrete aggregate replaced by taconite aggregate/tailings on north-zone segments
    conf: placeholder
    source: "MnDOT/NRRI: taconite aggregates performed as well or better in MnROAD test sections incl. concrete (Cell 54, 2004), used for decades near the mines; MnDOT notes limited information for design specifications"
  tailings_saving_per_t:
    value: 2
    low: -4
    high: 8
    unit: "USD/t of aggregate replaced (can be negative: hauling from the Range can cost more than local gravel)"
    conf: placeholder
    source: tailings are a mine by-product near the Range; saving depends on haul distance vs local gravel pits
  contingency_points:
    value: 0.01
    low: 0.0
    high: 0.02
    unit: contingency fraction removed
    conf: placeholder
    source: "long-term fixed-price contracts for steel, concrete and stator materials hedge price spikes like 2021-22; materials are only a few % of cost, so the hedge is worth ~1 point"
