# Material takeoff per km of DUAL-track guideway, and how much ore that means.
# Same leaf format as costs.yaml. Most quantities are first-principles guesses (conf placeholder)
# until replaced by published Transrapid beam/stator data or by the cfsem stator sizing (sim/).

guideway:
  concrete_elevated:
    value: 7500
    low: 6000
    high: 10000
    unit: m^3/km
    conf: "low"
    source: "Shanghai girders: 2,551 girders, most 24 m and 175 tons (ENR) = ~6.6 t/m = ~2.6 m3/m per guideway, ~5,300 m3/km of dual beams alone (derived); plus piers and footings below the frost line (not found, estimated ~2,000)"
  concrete_at_grade:
    value: 3500
    low: 2500
    high: 5000
    unit: m^3/km
    conf: "low"
    source: "at-grade guideway deck ~2,010 m3 concrete per double-track km without foundations (Gers 1997, Transrapid vs ICE ecology study); plus foundations"
  concrete_urban:
    value: 7500
    low: 5000
    high: 11000
    unit: m^3/km
    conf: placeholder
    source: taller piers, heavier foundations
  rebar_per_m3:
    value: 0.15
    low: 0.10
    high: 0.20
    unit: t/m^3 of concrete
    conf: low
    source: typical reinforced and prestressed bridge concrete
  strand_per_m3:
    value: 0.03
    low: 0.02
    high: 0.045
    unit: t/m^3 of concrete
    conf: low
    source: prestressing strand in post-tensioned beams
  stator_steel:
    value: 300
    low: 220
    high: 400
    unit: t/km
    conf: "low"
    source: "stator pack 1,032 x 158 x ~90 mm (GRIN, Der Linearmotor und die Technik des Transrapids) = ~110 kg solid, ~75 kg net of slots, ~73 kg/m per side, x4 = ~290 t per dual km (derived); pack mass not published"
  stator_aluminium:
    value: 20
    low: 15
    high: 23
    unit: t/km
    conf: "medium"
    source: "Gers 1997: ~20 t aluminium per double-track km; GRIN: aluminium conductor 300 mm2, cable length per phase 2.35x guideway = ~23 t per dual km (derived)"
  guidance_steel:
    value: 110
    low: 60
    high: 200
    unit: t/km
    conf: placeholder
    source: side guidance rails, gliding strips, fixings
  copper:
    value: 11.6
    low: 8
    high: 15
    unit: t/km
    conf: "medium"
    source: "Gers 1997: ~11.6 t copper per double-track km in line cables"

tunnel:
  concrete:
    value: 30000
    low: 20000
    high: 45000
    unit: m^3/km
    conf: placeholder
    source: segmental lining of a large twin bore

ore:
  pellets_per_t_steel:
    value: 1.45
    low: 1.35
    high: 1.6
    unit: t pellets / t steel
    conf: low
    source: ~65% Fe pellets to ~98% Fe steel incl. losses (blast furnace or DRI-EAF)
  taconite_per_t_pellets:
    value: 3.0
    low: 3.0
    high: 3.5
    unit: t crude taconite / t pellets
    conf: "medium"
    source: "EPA AP-42 11.23: crude taconite 30-35% Fe, pellets average 63% Fe, ~33% of crude becomes product; MN DNR via Mesabi Tribune (2019): ~3.5 t crude per t"
  cu_ore_grade:
    value: 0.0029
    low: 0.0025
    high: 0.0063
    unit: fraction Cu in ore
    conf: "medium"
    source: "NorthMet Feasibility Update (Dec 2022): reserves 289.2 M short tons at 0.290% Cu, 0.084% Ni (measured+indicated 0.252%); Twin Metals Maturi measured 0.63% Cu at 0.3% cut-off (2014) sets the high end"
  cu_recovery:
    value: 0.91
    low: 0.9
    high: 0.934
    unit: fraction
    conf: "medium"
    source: "NorthMet Feasibility Update (2022): Cu recovery 91.0%; Twin Metals Maturi 93.4%"
  cement_per_m3:
    value: 0.35
    low: 0.30
    high: 0.42
    unit: t cement / m^3 concrete
    conf: medium
    source: structural concrete mixes (300-420 kg/m^3)
  aggregate_per_m3:
    value: 1.9
    low: 1.8
    high: 2.0
    unit: t aggregate / m^3 concrete
    conf: medium
    source: sand + coarse aggregate in normal-weight concrete; taconite tailings are a candidate aggregate (verify MnDOT use)

# Material prices, delivered, 2026 USD. Used for the materials bill in the report (the guideway
# per-km costs already include materials; the bill shows how big a slice they are).
prices:
  concrete:
    value: 300
    low: 220
    high: 420
    unit: USD/m^3
    conf: low
    source: "US ready-mix averaged ~$180/yd3 in 2024 (NRMCA figure via a secondary site) = ~$235/m3; high-strength precast/structural mixes and placement cost more"
  rebar:
    value: 1000
    low: 900
    high: 1300
    unit: USD/t
    conf: low
    source: "US rebar ~$940-1,010/t in Q1 2026 (Chemanalyst; Expert Market Research, CFR Illinois), mills raising prices through 2026 (SMM, GMK)"
  strand:
    value: 1800
    low: 1400
    high: 2500
    unit: USD/t
    conf: placeholder
    source: prestressing strand (PC strand), premium over rebar; to source
  electrical_steel:
    value: 2800
    low: 2000
    high: 4000
    unit: USD/t
    conf: placeholder
    source: "non-oriented electrical steel; Cleveland-Cliffs' 2026 NOES raw-material surcharge alone is ~$315-435 per net ton (on top of the base price, which is not published)"
  structural_steel:
    value: 1600
    low: 1150
    high: 2500
    unit: USD/t
    conf: placeholder
    source: "guidance rails and fixings, fabricated; hot-rolled coil ~$950/short ton mid-2025 (Cliffs spot, secondary sites) before fabrication"
  copper:
    value: 14500
    low: 10000
    high: 16000
    unit: USD/t
    conf: medium
    source: "LME copper ~$14,200-14,800/t in Oct 2026, record ~$14,875 intraday Sep 2026 (Fastmarkets); long-run lower"
  aluminium:
    value: 3700
    low: 3000
    high: 4500
    unit: USD/t
    conf: low
    source: "LME aluminium ~$3,100/t early Oct 2026 plus a delivery premium (Rotterdam P1020A $550-585/t, Fastmarkets; US premium differs)"
  aggregate:
    value: 18
    low: 12
    high: 28
    unit: USD/t
    conf: placeholder
    source: crushed stone and sand delivered to site; check USGS Mineral Commodity Summaries (crushed stone unit value)

# Minnesota's take from the ore (state revenue, not a cost reduction).
mn_ore:
  production_tax:
    value: 3.427
    low: 3.427
    high: 3.427
    unit: USD per taxable ton of taconite pellets
    conf: high
    source: "MN Department of Revenue production tax table, 2025 rate $3.427 (2024 $3.345), adjusted yearly by the GDP deflator; paid to Range counties, cities, schools and IRRR"
  pellet_share_local:
    value: 0.8
    low: 0.5
    high: 1.0
    unit: share of the project's steel made from Minnesota pellets, with local supply
    conf: placeholder
    source: supply contracts specifying Mesabi pellets (Cleveland-Cliffs and U.S. Steel mills run on Minnesota/Michigan pellets)
  pellet_share_market:
    value: 0.4
    low: 0.2
    high: 0.6
    unit: share without a local-supply policy
    conf: placeholder
    source: "US steel from blast furnaces is largely Lake Superior pellets, but EAF mills (most rebar) run on scrap"
  annual_pellets:
    value: 34.5
    low: 28.6
    high: 34.6
    unit: Mt pellets per year produced in Minnesota (long tons ~ tonnes for scale)
    conf: high
    source: "Minnesota Minerals Tax Office via Mesabi Tribune (2025-12-12): 34.5 M tons 2023, 34.6 M 2024, ~28.55 M dry long tons estimated 2025"
