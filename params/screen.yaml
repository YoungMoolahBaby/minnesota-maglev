# The US corridor screen (src/mnmaglev/screen.py, `mnmaglev screen`). Not sampled: these shape the
# corridors' geometry and prices before the Monte Carlo runs.

built_up_factor:
  value: 0.25
  low: 0.25
  high: 1.0
  unit: share of the Census urban-area km on the straight line that are priced as urban viaduct
  conf: low
  source: "calibrated on the Minnesota spine: the screen method's straight lines run 59 km through Census 2020 urban areas outside the station approaches, the measured GIS alignment (least-cost route, NLCD impervious surface with roads left out) 14.4 km of built-up land, ratio 0.24 (tests/test_screen.py). One corridor; a real route also dodges built-up land by following freeways and railroads, which the factor carries. high = every urban-area km on viaduct (the screen's sensitivity run)"

# Construction prices (guideway, bridges, stations, switches, depot) scale by the region's area cost
# factor / Minnesota's. Systems, vehicles, land and O&M don't (bought nationally, priced per acre, wages).
area_cost_factor:
  minnesota:
    value: 1.12
    low: 1.11
    high: 1.13
    unit: construction cost index (DoD area cost factor; only ratios to minnesota are used)
    conf: medium
    source: "DoD UFS 3-701-01 Facilities Pricing Guide (6 June 2026), data tables Table 4-1 CONUS, MILCON 'AREA COST FACTOR' (96-base-city average = 1.00; 2025 surveys, 'current as of October 1, 2025'), https://legacy.wbdg.org/FFC/DOD/UFC/ufs_3_701_01_2026_Data_Tables.xlsx: Minneapolis 1.13, Fort Snelling 1.13, Rochester 1.12, Duluth 1.11; value = mean of the station cities, low/high = their range"
