# The vehicle and guideway system: a Transrapid-style long-stator EMS maglev.
# Same leaf format as costs.yaml.

vehicle:
  cruise_speed:
    value: 430
    low: 350
    high: 505
    unit: km/h
    conf: medium
    source: Shanghai ran 431 km/h; TR09 cruise 505 km/h (Wikipedia, Transrapid)
  urban_speed:
    value: 200
    low: 120
    high: 250
    unit: km/h
    conf: placeholder
    source: noise limit in built-up areas, to be set from a noise study
  accel:
    value: 0.9
    low: 0.7
    high: 1.0
    unit: m/s^2
    conf: medium
    source: Transrapid ~1 m/s^2 (Wikipedia); lower for standing passengers
  dwell:
    value: 120
    low: 60
    high: 180
    unit: s
    conf: low
    source: design choice
  section_mass:
    value: 60
    low: 55
    high: 66
    unit: t
    conf: "medium"
    source: "TR08 3 sections: 149.5 t empty + 27.9 t payload = ~59 t per loaded section; TR09 ~70 t (de.wikipedia Transrapid); TR07 45 t + 20 t payload (Sands, UCTC WP 183)"
  seats_per_section:
    value: 88
    low: 70
    high: 100
    unit: seats
    conf: medium
    source: Shanghai max 440 seats per 5-section train (Wikipedia)
  drag_coefficient:
    value: 0.41
    low: 0.32
    high: 0.5
    unit: "-"
    conf: "low"
    source: "effective whole-train drag, calibrated so the model reproduces TR08 5-section energy of 28.1 Wh/seat-km at 300 km/h (Schach et al., via de.wikipedia Transrapid; tests/test_model.py). Wikipedia's 0.26 underestimates a 128 m train. TR07 simulation 32/49 Wh/seat-km cruising at 300/400 km/h (Bundestag Drs. 11/2069)"
  frontal_area:
    value: 16
    low: 15
    high: 17
    unit: m^2
    conf: medium
    source: Wikipedia, Transrapid
  levitation_power:
    value: 1.7
    low: 1.4
    high: 2.2
    unit: kW/t
    conf: medium
    source: Wikipedia, Transrapid (levitation and guidance)
  propulsion_efficiency:
    value: 0.85
    low: 0.75
    high: 0.9
    unit: "-"
    conf: medium
    source: Wikipedia, Transrapid (aerodynamic power 3.53 MW -> 4.2 MW at 400 km/h)
  regen_fraction:
    value: 0.6
    low: 0.4
    high: 0.8
    unit: "-"
    conf: low
    source: braking energy is fed back to the grid (Wikipedia); share recovered is a guess
  hotel_power_winter:
    value: 45
    low: 25
    high: 80
    unit: kW/section
    conf: placeholder
    source: cabin heating at -25 C plus lighting, doors, HVAC fans
  hotel_power_summer:
    value: 20
    low: 10
    high: 40
    unit: kW/section
    conf: placeholder
    source: cooling and base loads

  schedule_speed:
    value: 0
    low: 0
    high: 0
    unit: km/h average along the route incl. stops and speed restrictions; 0 = run the kinematics
    conf: high
    source: "model switch: maglev and dedicated HSR run the kinematics on the measured alignment; upgraded conventional rail on freight track runs to a schedule speed from real services (params/technology.yaml)"

corridor:
  new_right_of_way:
    value: 1
    low: 1
    high: 1
    unit: 1 = a new corridor (land, wetlands, buildings, tall piers, ground adders, second-system reserve are bought or built), 0 = an existing railroad
    conf: high
    source: "model switch for the technology comparison (params/technology.yaml)"

geometry:
  superelevation_max:
    value: 12
    low: 12
    high: 12
    unit: deg
    conf: "high"
    source: "German maglev design rules (EBA Fahrweg Teil IV Trassierung, via BMVI Machbarkeitsstudie 2021 table 2-3): 12 deg on open track, 3 deg at platforms; ANL Survey of Foreign Maglev Systems (1993)"
  unbalanced_lateral:
    value: 1.5
    low: 1.0
    high: 2.0
    unit: m/s^2
    conf: "high"
    source: "German maglev design rules: unbalanced lateral acceleration limit 1.5 m/s2 (2.0 in switches) (BMVI Machbarkeitsstudie 2021); de.wikipedia radii 3,415 m at 400 km/h and 5,382 m at 500 match 12 deg + 1.5"
  max_gradient:
    value: 0.10
    low: 0.10
    high: 0.10
    unit: "-"
    conf: "high"
    source: "German maglev design rules: 100 per mille on open track, 5 at platforms (BMVI 2021); Pittsburgh planned max 8.1% (FRA 2005)"

service:
  trains_per_hour:
    value: 2
    low: 1
    high: 4
    unit: trains/h/direction
    conf: placeholder
    source: design choice until a demand model exists
  service_hours:
    value: 18
    low: 16
    high: 20
    unit: h/day
    conf: low
    source: design choice
  winter_share:
    value: 0.42
    low: 0.38
    high: 0.48
    unit: fraction of the year
    conf: low
    source: Nov-Mar ~5 of 12 months; heating loads and dense cold air apply
  min_transfer:
    value: 5
    low: 5
    high: 5
    unit: minutes, shortest planned connection at the Midway hub
    conf: low
    source: design choice (cross-platform change at one hub); used by `mnmaglev timetable` when staggering departures
  max_transfer_wait:
    value: 12
    low: 12
    high: 12
    unit: minutes, longest planned connection at the Midway hub
    conf: low
    source: design choice; with 30-minute headways anything longer feels like a missed train
