# Land, right-of-way and wetlands. Same leaf format as costs.yaml.
# Land classes are what segments in network/lines.yaml split their length into.
# The GIS phase replaces the per-segment shares with parcel-level data (county parcels via
# MnGeo, assessed values, land cover). Until then: planner estimates.

row_width:
  elevated:
    value: 20
    low: 15
    high: 30
    unit: m
    conf: placeholder
    source: dual guideway ~12 m wide plus maintenance access; piers leave the land under it farmable
  at_grade:
    value: 30
    low: 25
    high: 40
    unit: m
    conf: placeholder
    source: fenced corridor incl. snow storage strips
  urban:
    value: 15
    low: 10
    high: 25
    unit: m
    conf: placeholder
    source: viaduct in street or rail corridor

price_per_acre:
  urban_core:
    value: 3.0
    low: 1.0
    high: 10.0
    unit: MUSD/acre
    conf: "low"
    source: "downtown Minneapolis: 0.8 acre sold for $8.4 M in 2021 (~10.5 M/acre, Star Tribune); listings at 2.8-7.3 M/acre (LoopNet asks). St. Paul not found"
  suburban:
    value: 0.23
    low: 0.073
    high: 0.44
    unit: MUSD/acre
    conf: "medium"
    source: "land only (buildings are priced per building taken, land.buildings): MnGeo open parcels, assessed land EMV per acre in NLCD developed open/low-intensity cells (>60%) on the spine grid, 2026-11-04 run, 15,412 cells: median 230,111, p10 73,070, p90 436,356 USD/acre. Used where counties don't publish parcels"
  cropland_south:
    value: 0.011
    low: 0.0095
    high: 0.015
    unit: MUSD/acre
    conf: "medium"
    source: "UMN Minnesota Land Economics 2024 assessor values, tillable: Dakota 10,301, Goodhue 10,297, Olmsted 10,273, Rice 10,089, Steele 11,548, Blue Earth 11,410 USD/acre (sales run higher)"
  cropland_central:
    value: 0.0055
    low: 0.0027
    high: 0.008
    unit: MUSD/acre
    conf: "medium"
    source: "UMN Land Economics 2024 tillable: Pine 2,684, Chisago 4,323, Isanti 6,140, Stearns 7,004, Douglas 5,669, Clay 6,698 USD/acre; USDA NASS 2024 state cropland average $6,540"
  forest_north:
    value: 0.0015
    low: 0.0012
    high: 0.003
    unit: MUSD/acre
    conf: "medium"
    source: "UMN Land Economics 2024 timber: Carlton 1,913/1,854, St. Louis 1,322/1,503, Itasca 1,486/2,940 USD/acre; part is state/county/federal land (negotiation, not purchase)"
  wetland:
    value: 0.002
    low: 0.001
    high: 0.004
    unit: MUSD/acre
    conf: placeholder
    source: purchase price only; the mitigation cost is separate (below)

# Land class `existing_corridor` (highway or rail right-of-way shared with the guideway) has no
# price of its own: it costs a share of the price of the other land on the segment.
corridor:
  price_factor:
    value: 0.25
    low: 0.0
    high: 1.0
    unit: x the price of the land around it
    conf: "low"
    source: "23 U.S.C. 142(f): a state may make federal-aid highway right-of-way available 'with or without charge'; 23 CFR 810.212: use by a publicly owned transit authority may be without charge, the authority bears the incidental costs (low = free). Brightline West builds in I-15 right-of-way under Caltrans use agreements (2020, 2023; rent not public) and an NDOT occupancy permit. High = paying full value"

# Built-up land (GIS): a 210 m cell is priced as urban viaduct by a ramp on its non-road
# impervious surface (NLCD 2021 impervious %, interstates and highways left out).
developed:
  impervious_low:
    value: 20
    low: 20
    high: 20
    unit: "% non-road impervious in a 210 m cell (below: priced as rural)"
    conf: "medium"
    source: "~90th percentile of NLCD developed-open-space cells on the spine grid (parks, lawns, road verges: median 11%, p90 19%), so those stay rural"
  impervious_high:
    value: 35
    low: 35
    high: 35
    unit: "% non-road impervious in a 210 m cell (above: priced fully as built-up)"
    conf: "medium"
    source: "median of NLCD low-intensity cells on the spine grid (single-family suburbs: p10 28%, median 36%, p90 43%), so a typical suburb is fully built-up; medium intensity median 55%, high 80%"

acquisition_multiplier:
  value: 1.6
  low: 1.3
  high: 2.2
  unit: x land price
  conf: placeholder
  source: severance damages (cut farm fields), appraisal and legal, eminent domain delays (buildings and relocations are priced separately where the GIS counts them, see buildings below)

# Measured lines (GIS slice 5): land price from county parcels where counties publish them as open
# data (MnGeo; estimated market value of the land, emv_land / acres), the class prices above elsewhere.
parcels:
  emv_to_market:
    value: 1.05
    low: 0.98
    high: 1.15
    unit: x assessed estimated market value (EMV)
    conf: "low"
    source: "Minn. Stat. 273.11 subd. 1: EMV is meant to be market value; the Department of Revenue's sales ratio study holds county median ratios to 90-105% (IAAO standard), so sales run ~0-10% above EMV; EMV also lags a rising market by a year or two"

# Buildings in the right-of-way (GIS slice 5): FEMA USA Structures footprints (> 450 sq ft) along the
# route; a building is taken when the right-of-way touches it. Land under it is priced above (per acre).
# Dense urban ends run in streets (urban viaduct price, no takes); freeway right-of-way has none.
buildings:
  home_value:
    value: 0.255
    low: 0.197
    high: 0.346
    unit: MUSD per home taken (building only, EMV)
    conf: "medium"
    source: "MnGeo open parcels on the spine grid (2026-11-04 run, 367,871 residential parcels with a building): emv_bldg median $254,500, p25 197,300, p75 345,600; cf. ACS 2020-2024 median owner-occupied value in Minnesota $329,300 incl. land. Apartment buildings count as one home (undercounts relocations there)"
  home_relocation:
    value: 0.06
    low: 0.03
    high: 0.10
    unit: MUSD per home taken
    conf: "low"
    source: "49 CFR 24 as amended 2024-05-03 (89 FR 36908, in force 2024-06-03): replacement housing payment up to $41,200 for homeowners, $9,570 for tenants (more as 'last resort housing'), plus moving costs, closing costs and relocation advisory services"
  business_relocation:
    value: 0.15
    low: 0.06
    high: 0.50
    unit: MUSD per nonresidential building taken
    conf: placeholder
    source: "49 CFR 24.301-24.305 (2024 amounts): actual reasonable moving costs (no cap; machinery and stock dominate), reestablishment up to $33,200, site search up to $5,000, or a fixed payment up to $53,200 instead; goodwill and business losses are not federal entitlements"
  nonresidential_value_per_m2:
    value: 1200
    low: 600
    high: 2500
    unit: USD per m2 of footprint
    conf: placeholder
    source: "depreciated value of commercial and industrial buildings, mostly one storey; new construction runs ~2,000-3,500 USD/m2 of floor"
  farm_value_per_m2:
    value: 150
    low: 75
    high: 300
    unit: USD per m2 of footprint
    conf: placeholder
    source: "barns, sheds, machine buildings, bins (USA Structures 'Agriculture'); new pole barns cost ~160-430 USD/m2 ($15-40 per sq ft), older buildings are worth much less"
  demolition_per_m2:
    value: 100
    low: 50
    high: 200
    unit: USD per m2 of footprint
    conf: placeholder
    source: "demolition, abatement (asbestos, lead), utility disconnects and site restoration; residential demolition ~$4-15 per sq ft of footprint"

# Public land (GIS slice 6): USGS PAD-US 4.1 fee lands. Section 4(f) land = publicly owned parks,
# recreation areas, wildlife and waterfowl refuges (incl. waterfowl production areas, WMAs, SNAs),
# conservation and historic areas. National, state and county forests are multiple-use land: priced
# like the land around them (4(f) reaches only the parts set aside for recreation or refuge).
public:
  section_4f_avoidance_km:
    value: 1.0
    low: 0.3
    high: 3.0
    unit: km of elevated guideway (by cost) the route search spends to keep 1 km out of 4(f) land
    conf: placeholder
    source: "route search only. 49 U.S.C. 303 (all DOT agencies, FRA included): a project may use a public park, recreation area, wildlife or waterfowl refuge or historic site only if there is no feasible and prudent avoidance alternative and harm is minimised; 23 CFR 774.17: an avoidance alternative may be rejected as imprudent if, among other things, it costs 'an extraordinary magnitude' more. How much more is case law and agency judgment, not a number"
  section_4f_replacement:
    value: 1.0
    low: 1.0
    high: 2.0
    unit: acres of replacement land bought per acre of 4(f) land used
    conf: "low"
    source: "54 U.S.C. 200305(f)(3): land bought or developed with Land and Water Conservation Fund money may be converted only with replacement land of at least equal fair market value and reasonably equivalent usefulness and location; 23 CFR 774.17 lists replacement land and facilities of comparable value and function among 4(f) mitigation. High: replacement plus enhancements"

# Tribal land (GIS slice 6): federal reservations and off-reservation trust land (Census TIGER).
tribal:
  avoidance_km:
    value: 2.0
    low: 0.5
    high: 5.0
    unit: km of elevated guideway (by cost) the route search spends to keep 1 km out of tribal land
    conf: placeholder
    source: "route search only. 25 U.S.C. 324 and 25 CFR 169.107: a right-of-way across tribal trust land needs the tribe's consent, which it may withhold; tribal trust land can't be condemned. A route through a reservation is a negotiation between governments, not a land purchase"
  consent_multiplier:
    value: 3.0
    low: 1.0
    high: 10.0
    unit: x land price (tribal land)
    conf: placeholder
    source: "25 CFR 169.110: for tribal land the tribe negotiates the compensation and BIA defers to it; no published benchmark for a rail right-of-way found. Reservation boundaries also hold fee land owned by non-members; all of it is priced as if it needed consent"

wetlands:
  impact_fraction_elevated:
    value: 0.15
    low: 0.08
    high: 0.30
    unit: fraction of ROW in wetlands that is filled
    conf: placeholder
    source: pier footprints and construction access only
  impact_fraction_at_grade:
    value: 1.0
    low: 0.9
    high: 1.0
    unit: fraction
    conf: medium
    source: embankment fills the whole width
  replacement_ratio:
    value: 2.0
    low: 1.0
    high: 2.5
    unit: acres replaced per acre filled
    conf: "medium"
    source: "Minn. R. 8420.0522 subp. 4: 2.5 credits per acre impacted, -0.5 for a bank in the same service area (2:1); 1.5:1 or 1:1 in >80% areas and on agricultural land"
  credit_price:
    value: 0.07
    low: 0.03
    high: 0.12
    unit: MUSD/acre-credit
    conf: "medium"
    source: "BWSR '2025 Average Cost per Credit' (2024 sales, standard credits): Lake Superior 51,183, St. Croix 90,909, Middle Mississippi (metro) 119,820, Lower Mississippi 46,332, Minnesota River 56,876, Mississippi Headwaters 29,403 USD"

# Land held for a SECOND system beside the first (docs/PLAN.md, two-system corridor): build
# system A now, run it while the next generation (B) goes up beside it, then alternate.
# Priced for every line; added to a line's total only where lines.yaml sets reserve_second_system.
# In the country the extra width = B's own right-of-way (same as A's, from row_width by structure)
# + construction_separation. Jon (2026-11-03): far enough apart that either system can be built or
# rebuilt without much limitation on the one running next to it.
reserve:
  construction_separation:
    value: 50
    low: 35
    high: 80
    unit: m between the two systems' rights-of-way (rural)
    conf: placeholder
    source: >
      Keep the fall zone of piling rigs and crawler cranes (roughly their mast/boom length, ~30-60 m
      for pier and beam work) plus a haul road off the live guideway, so works on one system never
      need slow orders or possessions on the other. Launching gantries that erect beams from the new
      system's own piers could shrink it. To set from crane/rail-adjacent safety rules (RESEARCH 16).
  width_urban:
    value: 12
    low: 8
    high: 20
    unit: m
    conf: placeholder
    source: a second viaduct alongside in urban sections (tunnels need no surface land)
  acquisition_multiplier:
    value: 1.4
    low: 1.15
    high: 2.0
    unit: x land price
    conf: placeholder
    source: willing sellers and purchase options, widening a corridor already being bought (less new severance than a separate route); legal limits on taking land for a future system still open (RESEARCH.md)
  lease_income:
    value: 0.0002
    low: 0.00015
    high: 0.00029
    unit: MUSD/acre/year
    conf: "medium"
    source: "USDA NASS: Minnesota cropland cash rent $200/acre (2024 and 2025)"
