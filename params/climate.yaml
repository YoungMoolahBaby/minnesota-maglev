    conf: "high"
    source: "Minn. R. 1303.1600: Zone II incl. Dakota, Goodhue, Olmsted, Rice, Steele, Blue Earth, Winona"
  icing_hours:
    value: 166
    low: 56
    high: 213
    unit: hours per year with icing conditions
    conf: medium
    source: "Rochester (RST) hourly ASOS reports 2006-2025 (NWS/FAA, via Iowa Environmental Mesonet), scripts/icing_hours.py -> reference/icing.yaml. value = any icing condition (freezing rain/drizzle, ice pellets, freezing fog, unknown precip at <=1 C, wet snow at -2..+1 C); low = freezing precipitation only (FZRA/FZDZ/PL/UP); high = 90th-percentile year. Rochester has the most freezing precipitation of the four (~56 h/yr incl. unknown precip)"
  icing_nights:
    value: 26
