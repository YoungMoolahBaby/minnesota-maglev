    value: -3.7
    low: -6.0
    high: -3.0
    unit: degC (Nov-Mar)
    conf: "high"
    source: "NOAA NCEI 1991-2020 normals, MSP Nov-Mar (St. Cloud -6.0 sets the low end)"
  summer_mean_temp:
    value: 16.8
    low: 14.7
    high: 17.5
    unit: degC (Apr-Oct)
    conf: "high"
    source: "NOAA NCEI 1991-2020 normals, MSP Apr-Oct (St. Cloud 14.7)"
  snowfall:
    value: 130
    low: 120
    high: 140
    unit: cm/year
    conf: "high"
    source: "NOAA NCEI 1991-2020 normals, MSP 51.2 in/yr (St. Cloud 47.9)"
  frost:
    value: 0
    low: 0
    high: 0
    unit: "0 = south frost zone"
    conf: "high"
    source: "Minn. R. 1303.1600: Zone II (3.5 ft footings) incl. Anoka, Ramsey, Hennepin, Dakota, Chisago, Isanti, Sherburne, Stearns, Benton; Pine (Hinckley) is Zone I"
  icing_hours:
    value: 120
    low: 18
    high: 172
    unit: hours per year with icing conditions
    conf: medium
    source: "mean of Minneapolis-St. Paul (MSP 124) and St. Cloud (STC 115); hourly ASOS reports 2006-2025 (NWS/FAA, via Iowa Environmental Mesonet), scripts/icing_hours.py -> reference/icing.yaml. value = any icing condition (freezing rain/drizzle, ice pellets, freezing fog, unknown precip at <=1 C, wet snow at -2..+1 C); low = freezing precipitation only (FZRA/FZDZ/PL/UP); high = 90th-percentile year. STC reports little freezing rain (3.7 h/yr vs MSP 17.9) and more unknown precipitation, a sensor-classification difference, hence the average"
  icing_nights:
    value: 17.5
    low: 2
    high: 24
    unit: nights per year (18:00-06:00) with icing conditions
    conf: medium
    source: "MSP 16.4, STC 18.6 nights/yr; low = freezing rain or drizzle nights only (~2/yr)"

