# Climate zones. Each segment in network/lines.yaml names one zone.
# Same leaf format as costs.yaml. Values are rounded from memory of NOAA 1991-2020 normals and
# must be checked against NOAA NCEI station normals (Duluth DLH, Minneapolis MSP, Rochester RST,
# St. Cloud STC, ...). The GIS phase swaps zones for gridded data (PRISM/nClimGrid, Atlas 14/15).
#
# How climate enters the model now:
#   winter/summer mean temperature -> air density -> aerodynamic drag energy (computed, not guessed)
#   snowfall -> scales the winter O&M cost (reference 130 cm/yr = factor 1.0)
#   frost -> picks the frost foundation adder in costs.yaml (frost_north / frost_south)
# Not modelled yet (see docs/HAZARDS.md): freezing rain and guideway icing, wind limits on high
# viaducts, flood stage per crossing, freeze-thaw cycles on concrete, lake-effect snow near Duluth.

north:
  winter_mean_temp:
    value: -6.6
    low: -8.5
    high: -5.0
    unit: degC (Nov-Mar)
    conf: "high"
    source: "NOAA NCEI 1991-2020 normals, Duluth (USW00014913), Nov-Mar mean of monthly TAVG"
  summer_mean_temp:
    value: 12.9
    low: 12.0
    high: 14.0
    unit: degC (Apr-Oct)
    conf: "high"
    source: "NOAA NCEI 1991-2020 normals, Duluth, Apr-Oct mean"
  snowfall:
    value: 229
    low: 200
    high: 260
    unit: cm/year
    conf: "high"
    source: "NOAA NCEI 1991-2020 normals, Duluth 90.2 in/yr"
  frost:
    value: 1
    low: 1
    high: 1
    unit: "1 = north frost zone"
    conf: "high"
    source: "Minn. R. 1303.1600: Zone I (5 ft footings) incl. St. Louis, Carlton, Pine, Douglas, Clay, Crow Wing, Itasca; DLI air-freezing-index zones proposed, not adopted"
  icing_hours:
    value: 224
    low: 39
    high: 331
    unit: hours per year with icing conditions
    conf: medium
    source: "Duluth (DLH) hourly ASOS reports 2006-2025 (NWS/FAA, via Iowa Environmental Mesonet), scripts/icing_hours.py -> reference/icing.yaml. value = any icing condition (freezing rain/drizzle, ice pellets, freezing fog, unknown precip at <=1 C, wet snow at -2..+1 C); low = freezing precipitation only (FZRA/FZDZ/PL/UP); high = 90th-percentile year"
  icing_nights:
    value: 27
    low: 7
    high: 35
    unit: nights per year (18:00-06:00) with icing conditions
    conf: medium
    source: "Duluth (DLH), same data; low = nights with freezing rain or drizzle only (6.5/yr)"

central:
