[project]
name = "mnmaglev"
version = "0.1.0"
description = "Planning model for a Transrapid-style maglev network in Minnesota: route, land, climate, materials, cost"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = ["numpy>=2", "pyyaml>=6"]

[project.scripts]
mnmaglev = "mnmaglev.cli:main"

[project.optional-dependencies]
gis = [
    "pyproj>=3.8.0",
    "rasterio>=1.5.2",
    "scikit-image>=0.26.0",
    "shapely>=2.2.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mnmaglev"]
