# Measured along the GIS alignment (network/alignments/spine.geojson) by `mnmaglev gis spine`:
# USGS 3DEP elevation + NLCD 2021 land cover on a 210 m grid, FEMA NFHL flood zones
# (floodplain_share = 1% + 0.2% annual chance; floodway runs counted as bridge;
# flood_map_coverage = share of the piece where FEMA has digital maps), NLCD 2021
# impervious surface + descriptor (built_up_share = share of the piece's non-urban,
# non-bridge km priced as built-up viaduct; highway_corridor = beside a freeway).
# Guideway height = lowest profile at or above the ground within the grade limit;
# pier_excess_m_km = metres above each reference height x km (tall piers are priced
# above costs.guideway.pier_height_ref). gSSURGO soils: peat_share = Histosols (peat,
# muck) on the surveyed part, soil_survey_coverage = share surveyed (wetland stands in
# for peat elsewhere). Buildings (FEMA USA Structures): buildings_per_km2 by group beside
# the takeable km (n = count, side = sum sqrt(m2), area = sum m2, aside = sum m2^1.5).
# County parcels (MnGeo open counties): parcel_land_usd_per_acre = assessed land EMV per
# acre where parcel_coverage says the parcels cover the route. Public land (USGS PAD-US 4.1
# fee) and tribal land (Census TIGER reservations, off-reservation trust land):
# public_land_shares = section_4f (public parks, recreation areas, refuges, conservation
# and historic areas; outside freeway right-of-way), public_other (forests, other public
# land), tribal; the named units
# crossed are listed in public_land_crossed.
# Not yet: rail corridors. Land shares: NLCD groups (water, suburban = developed
# open/low, urban = developed medium/high, forest, open = crops/pasture/grass/shrub/barren,
# wetland).
