# Measured along the GIS alignment (network/alignments/southern_link.geojson) by `mnmaglev gis southern_link`:
# USGS 3DEP elevation + NLCD 2021 land cover on a 210 m grid, FEMA NFHL flood zones
# (floodplain_share = 1% + 0.2% annual chance; floodway runs counted as bridge;
# flood_map_coverage = share of the piece where FEMA has digital maps), NLCD 2021
# impervious surface + descriptor (built_up_share = share of the piece's non-urban,
# non-bridge km priced as built-up viaduct; highway_corridor = beside a freeway).
# Guideway height = lowest profile at or above the ground within the grade limit;
# pier_excess_m_km = metres above each reference height x km (tall piers are priced
# above costs.guideway.pier_height_ref). gSSURGO soils: peat_share = Histosols (peat,
# muck) on the surveyed part, soil_survey_coverage = share surveyed (wetland stands in
# for peat elsewhere).
# Not yet: parcels, rail corridors. Land shares: NLCD groups (water, suburban = developed
# open/low, urban = developed medium/high, forest, open = crops/pasture/grass/shrub/barren,
# wetland).
