# Variant: the spine through downtown Minneapolis (Target Field area) instead of the Midway hub,
# and the St. Cloud line starting downtown. The default until 2026-11-03, when Jon picked Midway.
# St. Paul riders take the Green Line to downtown Minneapolis (or board at MSP for Rochester).
# Run it: uv run mnmaglev report --variant downtown_minneapolis
# Lines here replace the lines with the same id in network/lines.yaml.
# First run: spine P50 $73.3 bn vs $68.9 bn via Midway (mostly the extra downtown tunnel).

lines:
  - id: spine
    name: Arrowhead - Twin Cities - Med City
    reserve_second_system: true   # hold land + build-for-two provisions for a second system (docs/PLAN.md)
    phase: 1
    points: [duluth, hinckley, minneapolis, msp, rochester]
    note: >
      Downtown Minneapolis variant. The Duluth approach
      descends ~200 m from the hilltop to the harbour (fine for 10% maglev grades, check icing).
    defaults:
      detour: 1.10
      zone: central
      urban_start_km: 0
      urban_end_km: 0
      urban_tunnel: 0.0
      structure: {elevated: 0.75, at_grade: 0.25}
      land: {cropland_central: 0.6, suburban: 0.1, existing_corridor: 0.2, wetland: 0.1}
      floodplain: 0.05
      peat: 0.02
      bridges: []
    segments:
      - from: duluth
        to: hinckley
        zone: north
        detour: 1.12
        urban_start_km: 6
        structure: {elevated: 0.85, at_grade: 0.15}
        land: {urban_core: 0.02, suburban: 0.04, forest_north: 0.45, wetland: 0.2, cropland_central: 0.09, existing_corridor: 0.2}
        floodplain: 0.06
        peat: 0.15
        bridges: [{name: St. Louis River, length_m: 450}, {name: Kettle River, length_m: 250}]
      - from: hinckley
        to: minneapolis
        detour: 1.12
        urban_end_km: 18
        urban_tunnel: 0.25
        land: {forest_north: 0.15, wetland: 0.12, cropland_central: 0.38, suburban: 0.15, urban_core: 0.02, existing_corridor: 0.18}
        floodplain: 0.05
        peat: 0.06
        bridges: [{name: Mississippi River (Minneapolis), length_m: 450}]
      - from: minneapolis
        to: msp
        detour: 1.15
        urban_start_km: 15
        urban_tunnel: 0.3
        land: {urban_core: 0.25, suburban: 0.45, existing_corridor: 0.3}
        floodplain: 0.0
        peat: 0.0
      - from: msp
        to: rochester
        detour: 1.10
        zone: south
        urban_start_km: 6
        urban_end_km: 6
        structure: {elevated: 0.7, at_grade: 0.3}
        land: {suburban: 0.12, cropland_south: 0.6, existing_corridor: 0.2, wetland: 0.05, urban_core: 0.03}
        floodplain: 0.08
        peat: 0.02
        bridges: [{name: Minnesota River valley, length_m: 1500}, {name: Cannon River, length_m: 300}, {name: Zumbro River, length_m: 200}]

  - id: west
    name: Twin Cities - St. Cloud - Fargo/Moorhead
    phase: 2
    points: [minneapolis, st_cloud, alexandria, moorhead]
    defaults:
      detour: 1.08
      zone: central
      urban_start_km: 0
      urban_end_km: 3
      urban_tunnel: 0.0
      structure: {elevated: 0.65, at_grade: 0.35}
      land: {cropland_central: 0.65, existing_corridor: 0.2, wetland: 0.1, suburban: 0.05}
      floodplain: 0.05
      peat: 0.03
      bridges: []
    segments:
      - from: minneapolis
        to: st_cloud
        urban_start_km: 12
        urban_tunnel: 0.0
        land: {suburban: 0.3, cropland_central: 0.4, existing_corridor: 0.25, wetland: 0.05}
      - from: st_cloud
        to: alexandria
      - from: alexandria
        to: moorhead
        floodplain: 0.15
        note: Red River valley, flood history 1997 and 2009; Red River crossing only if serving Fargo directly
        bridges: [{name: Buffalo River, length_m: 150}]
