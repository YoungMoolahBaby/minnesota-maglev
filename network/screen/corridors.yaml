corridors:
  minnesota:
    name: Duluth - Twin Cities - Rochester (Minnesota spine, screen method)
    region: minnesota
    zone: central
    heating: targeted
    lines:
      - id: mn_spine
        points: [duluth, hinckley, midway_hub, msp, rochester]
        segments:
          duluth-hinckley: {zone: north, detour: 1.06, bridges: [{name: St. Louis River, length_m: 450}, {name: Kettle River, length_m: 250}]}
          midway_hub-msp: {detour: 1.04, bridges: [{name: Mississippi River gorge, length_m: 450}]}
          msp-rochester: {zone: south, detour: 1.04, bridges: [{name: Minnesota River valley, length_m: 1500}, {name: Cannon River, length_m: 300}, {name: Zumbro River, length_m: 200}]}
    markets:
      twin_cities: {cbsa: "33460", stations: [midway_hub, msp]}
      duluth:      {cbsa: "20260", stations: [duluth]}
      rochester:   {cbsa: "40340", stations: [rochester]}

  texas_central:
    name: Dallas - Houston (Texas Central route)
    region: texas
    zone: texas
    heating: none
    lines:
      - id: dallas_houston
        points: [dallas, brazos_valley, houston]
        segments:
          dallas-brazos_valley: {detour: 1.07, bridges: [{name: Trinity River floodway, length_m: 2000}]}
          brazos_valley-houston: {detour: 1.07}
    markets:
      dallas:          {cbsa: "19100", stations: [dallas]}
      college_station: {cbsa: "17780", stations: [brazos_valley]}
      houston:         {cbsa: "26420", stations: [houston]}

  texas_i35:
    name: San Antonio - Austin - Waco - Dallas (I-35)
    region: texas
    zone: texas
    heating: none
    lines:
      - id: i35
        points: [san_antonio, austin, waco, dallas]
        segments:
          san_antonio-austin: {detour: 1.08}
          austin-waco: {detour: 1.06, bridges: [{name: Brazos River, length_m: 300}]}
          waco-dallas: {detour: 1.06, bridges: [{name: Trinity River floodway, length_m: 1500}]}
    markets:
      san_antonio: {cbsa: "41700", stations: [san_antonio]}
      austin:      {cbsa: "12420", stations: [austin]}
      waco:        {cbsa: "47380", stations: [waco]}
      dallas:      {cbsa: "19100", stations: [dallas]}

  california:
    name: San Francisco - San Jose - Fresno - Bakersfield - Los Angeles (CA HSR phase 1 route)
    region: california
    zone: california
    heating: none
    # mountain tunnels as CA HSR plans them (a maglev's 10% grades might need fewer): Pacheco Pass ~15 mi
    # (2022 Final EIR/EIS), Bakersfield - Palmdale nine tunnels 'more than 10 miles', Palmdale - Burbank
    # ~28 mi (CHSRA tunneling fact sheet Nov 2024; secondary sources, docs/SOURCES.md)
    lines:
      - id: ca_hsr
        points: [san_francisco, redwood_city, san_jose, gilroy, chowchilla, fresno, bakersfield, tehachapi, palmdale, los_angeles]
        segments:
          san_francisco-redwood_city: {detour: 1.05}
          redwood_city-san_jose: {detour: 1.05}
          gilroy-chowchilla: {detour: 1.12, tunnel_km: 24, bridges: [{name: San Joaquin River and floodway, length_m: 1500}]}
          bakersfield-tehachapi: {detour: 1.25, tunnel_km: 8}
          tehachapi-palmdale: {detour: 1.15, tunnel_km: 8}
          palmdale-los_angeles: {detour: 1.15, tunnel_km: 45}
    markets:
      san_francisco: {cbsa: "41860", stations: [san_francisco]}
      san_jose:      {cbsa: "41940", stations: [san_jose]}
      fresno:        {cbsa: "23420", stations: [fresno]}
      bakersfield:   {cbsa: "12540", stations: [bakersfield]}
      los_angeles:   {cbsa: "31080", stations: [palmdale, los_angeles]}

  socal_vegas:
    name: Los Angeles - Rancho Cucamonga - Las Vegas (I-15, Brightline West route extended to LA)
    region: mojave
    zone: mojave
    heating: none
    lines:
      - id: la_vegas
        points: [los_angeles, rancho_cucamonga, victorville, barstow, las_vegas]
        segments:
          los_angeles-rancho_cucamonga: {detour: 1.10}
          rancho_cucamonga-victorville: {detour: 1.20}
          barstow-las_vegas: {detour: 1.08}
    markets:
      los_angeles:     {cbsa: "31080", stations: [los_angeles]}
      inland_empire:   {cbsa: "40140", stations: [rancho_cucamonga]}
      las_vegas:       {cbsa: "29820", stations: [las_vegas]}

  northeast:
    name: Washington - Baltimore - Philadelphia - New York - Providence - Boston (a new line beside the NEC)
    region: northeast
    zone: northeast
    heating: targeted
    lines:
      - id: nec
        points: [washington, baltimore, philadelphia, new_york, stamford, new_haven, providence, boston]
        segments:
          washington-baltimore: {detour: 1.08}
          baltimore-philadelphia: {detour: 1.08, bridges: [{name: Susquehanna River, length_m: 1300}, {name: Gunpowder and Bush rivers, length_m: 1200}]}
          philadelphia-new_york: {detour: 1.06, tunnel_km: 6, bridges: [{name: Delaware River, length_m: 600}, {name: Hackensack and Passaic meadows, length_m: 3000}]}
          new_york-stamford: {detour: 1.08, tunnel_km: 10}
          stamford-new_haven: {detour: 1.08, bridges: [{name: Housatonic and Norwalk rivers, length_m: 1000}]}
          new_haven-providence: {detour: 1.12, bridges: [{name: Connecticut River, length_m: 1000}, {name: Thames River, length_m: 800}]}
          providence-boston: {detour: 1.06}
    markets:
      washington:   {cbsa: "47900", stations: [washington]}
      baltimore:    {cbsa: "12580", stations: [baltimore]}
      philadelphia: {cbsa: "37980", stations: [philadelphia]}
      new_york:     {cbsa: "35620", stations: [new_york]}
      providence:   {cbsa: "39300", stations: [providence]}
      boston:       {cbsa: "14460", stations: [boston]}

