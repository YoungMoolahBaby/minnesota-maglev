# The US corridor screen (docs/PLAN.md): the same model on other US corridors, so Minnesota's
# benefit-cost ratio can be read against places with denser travel markets.
#
# A screen corridor is a planner-level line, like the Minnesota lines before the GIS phase, with one
# thing measured: the built-up km between the stations (Census 2020 urban areas, `mnmaglev
# screen-data`), priced as urban viaduct the way the GIS prices built-up land on measured lines.
# Everything else here is a PLANNER ESTIMATE (Claude, 2026-11-05, for Jon to check): station sites
# (city centres or the stations real projects chose), urban approach km and their tunnel share,
# detours, long bridges, mountain tunnels. Construction cost scales by each region's DoD area cost
# factor relative to Minneapolis (params/screen.yaml); the climate zones are in params/climate.yaml.
#
# Station fields: name, lat, lon, type (terminal_major | airport | city | waypoint),
#   approach_km  km of speed-limited urban structure on each side of the station
#   tunnel       share of those approach km in tunnel (dense cores: Manhattan, downtown SF, ...)
# Corridor fields: name, region (cost factor), zone (climate), heating (targeted | none: targeted where
#   the ASOS stations average 5+ icing nights a year, reference/icing_screen.yaml),
#   lines (each: id, points, optional per-segment overrides keyed "a-b": detour, zone, bridges
#   [{name, length_m}], tunnel_km (mountain tunnels in the rural km)), markets (id: cbsa, stations).
# Markets are Census CBSAs (2023 delineation, Vintage 2025 populations); their NHTS zones are found
# from the CBSA's counties. Connecticut is left out: Census now reports its planning regions, which
# the NHTS zone lookup (old counties) doesn't know, so New Haven, Bridgeport-Stamford and Hartford
# get no station (an understatement of the Northeast Corridor's market).

defaults:
  detour: 1.10
  structure: {elevated: 0.75, at_grade: 0.25}
  corridor_share: 0.2    # share of the rural route beside a freeway or railroad (land, adders)
  floodplain: 0.05
  peat: 0.02

