# Departure offsets per line, minutes after 06:00 (then every headway), forward = from the
# line's first point, reverse = from its last. Written by `mnmaglev timetable --write`, which
# picks them to minimise the network's 1-second power peak, phase by phase. The power model
# and the fusion sizing read this file; delete it to go back to aligned departures.
offsets:
  spine:
    forward: 14
    reverse: 0
  iron_range:
    forward: 5
    reverse: 9
  west:
    forward: 25
    reverse: 14
  southwest:
    forward: 26
    reverse: 15
  north_woods:
    forward: 6
    reverse: 1
  southern_link:
    forward: 2
    reverse: 4
  great_lakes:
    forward: 13
    reverse: 17
peaks_mw:
- phase: 1
  peak_aligned_mw: 91.0
  peak_staggered_mw: 74.7
- phase: 2
  peak_aligned_mw: 263.9
  peak_staggered_mw: 136.8
- phase: 3
  peak_aligned_mw: 523.7
  peak_staggered_mw: 238.4
