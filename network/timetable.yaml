# Departure offsets per line, minutes after 06:00 (then every headway), forward = from the
# line's first point, reverse = from its last. Written by `mnmaglev timetable --write`, which
# picks them to minimise the network's 1-second power peak, phase by phase. The power model
# and the fusion sizing read this file; delete it to go back to aligned departures.
offsets:
  spine:
    forward: 27
    reverse: 0
  iron_range:
    forward: 20
    reverse: 10
  west:
    forward: 2
    reverse: 16
  southwest:
    forward: 21
    reverse: 7
  north_woods:
    forward: 19
    reverse: 16
  southern_link:
    forward: 21
    reverse: 13
  great_lakes:
    forward: 2
    reverse: 0
peaks_mw:
- phase: 1
  peak_aligned_mw: 94.6
  peak_staggered_mw: 74.6
- phase: 2
  peak_aligned_mw: 267.5
  peak_staggered_mw: 135.5
- phase: 3
  peak_aligned_mw: 527.3
  peak_staggered_mw: 236.4
