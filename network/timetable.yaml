# Departure offsets per line, minutes after 06:00 (then every headway), forward = from the
# line's first point, reverse = from its last. Written by `mnmaglev timetable --write`, which
# picks them to minimise the network's 1-second power peak, phase by phase. The power model
# and the fusion sizing read this file; delete it to go back to aligned departures.
offsets:
  spine:
    forward: 0
    reverse: 28
  iron_range:
    forward: 15
    reverse: 20
  west:
    forward: 1
    reverse: 9
  southwest:
    forward: 9
    reverse: 18
  north_woods:
    forward: 2
    reverse: 0
  southern_link:
    forward: 23
    reverse: 8
  great_lakes:
    forward: 14
    reverse: 14
  heartland:
    forward: 26
    reverse: 22
peaks_mw:
- phase: 1
  peak_aligned_mw: 93.5
  peak_staggered_mw: 67.3
- phase: 2
  peak_aligned_mw: 332.0
  peak_staggered_mw: 134.4
- phase: 3
  peak_aligned_mw: 664.6
  peak_staggered_mw: 235.7
- phase: 4
  peak_aligned_mw: 860.7
  peak_staggered_mw: 392.0
