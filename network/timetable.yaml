# Departure offsets per line, minutes after 06:00 (then every headway), forward = from the
# line's first point, reverse = from its last. Written by `mnmaglev timetable --write`, which
# picks them to minimise the network's 1-second power peak, phase by phase. The power model
# and the fusion sizing read this file; delete it to go back to aligned departures.
offsets:
  spine:
    forward: 3
    reverse: 0
  iron_range:
    forward: 3
    reverse: 6
  west:
    forward: 3
    reverse: 12
  southwest:
    forward: 15
    reverse: 23
  north_woods:
    forward: 0
    reverse: 6
  southern_link:
    forward: 8
    reverse: 11
  great_lakes:
    forward: 19
    reverse: 4
peaks_mw:
- phase: 1
  peak_aligned_mw: 92.3
  peak_staggered_mw: 65.4
- phase: 2
  peak_aligned_mw: 265.2
  peak_staggered_mw: 132.5
- phase: 3
  peak_aligned_mw: 525.0
  peak_staggered_mw: 235.3
