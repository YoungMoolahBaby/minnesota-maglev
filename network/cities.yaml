# Places the network can stop at or pass through.
# type: terminal_major | airport | city | waypoint (waypoint = no station, shapes the route)
# pop: 2020 Census city population (verified 2026-11-03 against Census QuickFacts / Wikipedia lists;
#      Brainerd / Baxter = 14,395 + 8,612).
# Coordinates: city centres (approximate), station sites are a later design step.

# The Twin Cities hub (default, 2026-11-03): one station between the two downtowns, fed by the
# Green Line (University Ave), the A Line (Snelling) and buses. Site is a placeholder at
# Snelling & University; the GIS phase picks the real one (Prospect Park and the Midway rail
# corridor are alternatives). Room for two systems (see docs/PLAN.md, two-system corridor).
