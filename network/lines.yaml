# The network, the part you edit like a city builder.
# A line runs through points (ids from cities.yaml); a segment joins two neighbouring points.
# Every segment takes the line's `defaults`, then its own overrides.
#
# Segment fields:
#   detour            route length / straight-line length (terrain, lakes, following corridors)
#   zone              climate zone in params/climate.yaml
#   urban_start_km    km of urban structure leaving the `from` point (speed-limited, urban costs)
#   urban_end_km      km of urban structure arriving at the `to` point
#   urban_tunnel      share of the urban km in tunnel (rest = urban viaduct)
#   structure         shares of the RURAL km: elevated / at_grade (sum to 1); GIS-measured lines
#                     add urban_viaduct for built-up km between the urban ends (suburbs)
#   land              shares of the route by land class in params/land.yaml (sum to 1);
#                     existing_corridor = highway / rail right-of-way, priced as
#                     land.corridor.price_factor x the other land on the segment
#   floodplain        share of the route on mapped floodplain (FEMA NFHL in the GIS phase)
#   peat              share on peat / soft ground (deep piles)
#   bridges           long crossings: name + length_m (costed per metre, not as guideway)
#
# Line field:
#   reserve_second_system  true = hold land beside the line and build-for-two provisions so a
#                          next-generation system can be built while this one runs (priced for
#                          every line in the report; counted in the total only when true)
#
# All shares and crossings are PLANNER ESTIMATES until the GIS phase (docs/PLAN.md, phase 2)
# measures them from lidar, land cover, NWI wetlands, FEMA floodplains and parcels.

settings:
  # Minnesota-made guideway beams and stator packs, taconite aggregate near the Range, long-term
  # supply contracts with Minnesota mines and mills (params costs.local_supply.*). The report shows
  # the saving either way; this decides whether it counts in the totals.
  local_supply: true
  # The megaproject's own small fusion units (params/power.yaml), sized from the timetable's
  # second-by-second peak with headroom and a spare unit, no batteries; the surplus powers
  # neighbouring users or goes to the grid. "none" = grid power only.
  fusion: own
  # Guideway heating against ice (params/winter.yaml): targeted = critical spots during icing plus
  # overnight warming of the whole line with idle fusion units; full = whole line during icing; none.
  winter_heating: targeted
  # Track security (params/security.yaml), Jon 2026-11-04: autonomous ground robots with magnetic
  # gradiometers sweep both guideway beams every night, dock-based drones patrol the route day and
  # night, remote operators supervise; charged from the network's power (the fusion fleet). none = off.
  security: robots

lines:
  - id: spine
    name: Arrowhead - Twin Cities - Med City
    reserve_second_system: true   # hold land + build-for-two provisions for a second system (docs/PLAN.md)
    use_measured: true   # segments from the GIS alignment (network/measured/spine.yaml); --no-measured = the estimates below
    phase: 1
    points: [duluth, hinckley, midway_hub, msp, rochester]
    note: >
      The priority corridor. The Twin Cities station is one hub in the Midway area between
      Minneapolis and St. Paul (Jon's choice, 2026-11-03), fed by the Green Line, the A Line and
      buses, so both cities are served equally and the line avoids downtown tunnels. MSP stays a
      stop for airport - Rochester (Mayo) trips. Alternative kept in network/variants/downtown_minneapolis.yaml.
      The Duluth approach descends ~200 m from the hilltop to the harbour (fine for 10% maglev
      grades, check icing).
    defaults:
      detour: 1.10
      zone: central
      urban_start_km: 0
      urban_end_km: 0
      urban_tunnel: 0.0
      structure: {elevated: 0.75, at_grade: 0.25}
      land: {cropland_central: 0.6, suburban: 0.1, existing_corridor: 0.2, wetland: 0.1}
      floodplain: 0.05
      peat: 0.02
      bridges: []
    segments:
      - from: duluth
        to: hinckley
        zone: north
        detour: 1.12
        urban_start_km: 6
        structure: {elevated: 0.85, at_grade: 0.15}
        land: {urban_core: 0.02, suburban: 0.04, forest_north: 0.45, wetland: 0.2, cropland_central: 0.09, existing_corridor: 0.2}
        floodplain: 0.06
        peat: 0.15
        bridges: [{name: St. Louis River, length_m: 450}, {name: Kettle River, length_m: 250}]
      - from: hinckley
        to: midway_hub
        detour: 1.12
        urban_end_km: 16
        urban_tunnel: 0.10
        land: {forest_north: 0.15, wetland: 0.12, cropland_central: 0.38, suburban: 0.17, existing_corridor: 0.18}
        floodplain: 0.03
        peat: 0.06
        note: through the northern suburbs on existing freeway/rail corridors; no Mississippi crossing needed
      - from: midway_hub
        to: msp
        detour: 1.15
        urban_start_km: 9.5
        urban_tunnel: 0.25
        land: {urban_core: 0.1, suburban: 0.5, existing_corridor: 0.4}
        floodplain: 0.1
        peat: 0.0
        note: crosses the Mississippi gorge (Mississippi National River and Recreation Area) toward Fort Snelling and the airport
        bridges: [{name: Mississippi River gorge, length_m: 450}]
      - from: msp
        to: rochester
        detour: 1.10
        zone: south
        urban_start_km: 6
        urban_end_km: 6
        structure: {elevated: 0.7, at_grade: 0.3}
        land: {suburban: 0.12, cropland_south: 0.6, existing_corridor: 0.2, wetland: 0.05, urban_core: 0.03}
        floodplain: 0.08
        peat: 0.02
        bridges: [{name: Minnesota River valley, length_m: 1500}, {name: Cannon River, length_m: 300}, {name: Zumbro River, length_m: 200}]

  - id: iron_range
    name: Duluth - Iron Range
    use_measured: true   # network/measured/iron_range.yaml
    phase: 2
    points: [duluth, virginia, hibbing]
    note: Serves the Mesabi Range, where the guideway steel's iron ore comes from.
    defaults:
      detour: 1.12
      zone: north
      urban_start_km: 0
      urban_end_km: 2
      urban_tunnel: 0.0
      structure: {elevated: 0.85, at_grade: 0.15}
      land: {forest_north: 0.55, wetland: 0.25, existing_corridor: 0.15, suburban: 0.05}
      floodplain: 0.05
      peat: 0.25
      bridges: []
    segments:
      - from: duluth
        to: virginia
        urban_start_km: 5
        bridges: [{name: Cloquet / St. Louis River, length_m: 300}]
      - from: virginia
        to: hibbing
        detour: 1.15
        note: around active and former open pits

  - id: west
    name: Twin Cities - St. Cloud - Fargo/Moorhead
    use_measured: true   # network/measured/west.yaml
    phase: 2
    points: [midway_hub, st_cloud, alexandria, moorhead]
    defaults:
      detour: 1.08
      zone: central
      urban_start_km: 0
      urban_end_km: 3
      urban_tunnel: 0.0
      structure: {elevated: 0.65, at_grade: 0.35}
      land: {cropland_central: 0.65, existing_corridor: 0.2, wetland: 0.1, suburban: 0.05}
      floodplain: 0.05
      peat: 0.03
      bridges: []
    segments:
      - from: midway_hub
        to: st_cloud
        urban_start_km: 15
        urban_tunnel: 0.1
        land: {suburban: 0.3, cropland_central: 0.4, existing_corridor: 0.25, wetland: 0.05}
        note: leaves the hub northwest, crossing the Mississippi in the north metro
        bridges: [{name: Mississippi River (north metro), length_m: 450}]
      - from: st_cloud
        to: alexandria
      - from: alexandria
        to: moorhead
        floodplain: 0.15
        note: Red River valley, flood history 1997 and 2009; Red River crossing only if serving Fargo directly
        bridges: [{name: Buffalo River, length_m: 150}]

  - id: southwest
    name: Twin Cities - Mankato
    use_measured: true   # network/measured/southwest.yaml
    phase: 2
    points: [msp, mankato]
    defaults:
      detour: 1.10
      zone: south
      urban_start_km: 8
      urban_end_km: 3
      urban_tunnel: 0.0
      structure: {elevated: 0.7, at_grade: 0.3}
      land: {suburban: 0.15, cropland_south: 0.6, existing_corridor: 0.2, wetland: 0.05}
      floodplain: 0.15
      peat: 0.02
      bridges: [{name: Minnesota River, length_m: 600}]

  - id: north_woods
    name: St. Cloud - Brainerd - Bemidji
    use_measured: true   # network/measured/north_woods.yaml
    phase: 3
    points: [st_cloud, brainerd, bemidji]
    defaults:
      detour: 1.12
      zone: north
      urban_start_km: 2
      urban_end_km: 2
      urban_tunnel: 0.0
      structure: {elevated: 0.75, at_grade: 0.25}
      land: {forest_north: 0.45, cropland_central: 0.25, wetland: 0.2, existing_corridor: 0.1}
      floodplain: 0.05
      peat: 0.15
      bridges: [{name: Mississippi River, length_m: 300}]

  - id: southern_link
    name: Rochester - Owatonna - Mankato
    use_measured: true   # network/measured/southern_link.yaml
    phase: 3
    points: [rochester, owatonna, mankato]
    defaults:
      detour: 1.08
      zone: south
      urban_start_km: 3
      urban_end_km: 3
      urban_tunnel: 0.0
      structure: {elevated: 0.6, at_grade: 0.4}
      land: {cropland_south: 0.75, existing_corridor: 0.15, wetland: 0.05, suburban: 0.05}
      floodplain: 0.06
      peat: 0.02
      bridges: []

  - id: great_lakes
    name: Rochester - La Crosse - Madison - Milwaukee - Chicago
    use_measured: true   # network/measured/great_lakes.yaml
    phase: 3
    points: [rochester, winona, la_crosse, madison, milwaukee, chicago]
    note: Out of state past Winona; needs Wisconsin and Illinois partners. Climate zones are a stretch here.
    defaults:
      detour: 1.10
      zone: south
      urban_start_km: 4
      urban_end_km: 4
      urban_tunnel: 0.0
      structure: {elevated: 0.7, at_grade: 0.3}
      land: {cropland_south: 0.55, forest_north: 0.1, existing_corridor: 0.2, wetland: 0.08, suburban: 0.07}
      floodplain: 0.08
      peat: 0.02
      bridges: []
    segments:
      - from: rochester
        to: winona
        note: descends the Mississippi bluffs (~180 m)
      - from: winona
        to: la_crosse
        floodplain: 0.3
        bridges: [{name: Mississippi River and backwaters, length_m: 2500}]
      - from: la_crosse
        to: madison
        detour: 1.15
        note: Driftless Area ridges and valleys
      - from: madison
        to: milwaukee
      - from: milwaukee
        to: chicago
        urban_start_km: 8
        urban_end_km: 20
        urban_tunnel: 0.4
        land: {suburban: 0.4, urban_core: 0.1, existing_corridor: 0.4, cropland_south: 0.1}

  - id: heartland
    name: Twin Cities - Des Moines - Omaha - Denver
    phase: 4
    points: [msp, owatonna, albert_lea, mason_city, ames, des_moines, omaha, lincoln, grand_island, kearney, north_platte, den, denver]
    note: >
      Jon (2026-11-04): Minneapolis - Des Moines - Omaha - Denver, not via Chicago, with Albert Lea as a stop (MSP - Chicago -
      Denver is 2,049 km in straight lines, this route 1,394, direct 1,122). Down I-35 (Owatonna,
      Albert Lea, Mason City, Ames and Ankeny sit within a few km of the straight MSP - Des Moines
      line), then I-80 across Iowa and up the Platte valley, then I-76 to Denver: Kearney - North
      Platte - Denver is 26 km longer than Kearney - Denver direct and serves the only city in that
      480 km gap. Des Moines - Omaha - Denver is the trunk a Chicago - Denver line (via Iowa City)
      would share. Needs Iowa, Nebraska and Colorado partners; land prices and climate zones are
      Minnesota's (RESEARCH 29, 34).
    defaults:
      detour: 1.06
      zone: south
      urban_start_km: 3
      urban_end_km: 3
      urban_tunnel: 0.0
      structure: {elevated: 0.6, at_grade: 0.4}
      land: {cropland_south: 0.75, existing_corridor: 0.15, suburban: 0.05, wetland: 0.05}
      floodplain: 0.06
      peat: 0.01
      bridges: []
    segments:
      - from: msp
        to: owatonna
        urban_start_km: 8
        land: {suburban: 0.25, cropland_south: 0.5, existing_corridor: 0.2, wetland: 0.05}
        floodplain: 0.1
        note: leaves MSP south over the Minnesota River (measured water and floodway there, 2026-11-04 routes - southwest line 0.6 km, spine 1.9 km)
        bridges: [{name: Minnesota River, length_m: 1000}]
      - from: owatonna
        to: albert_lea
        note: down I-35
      - from: albert_lea
        to: mason_city
      - from: mason_city
        to: ames
      - from: ames
        to: des_moines
        urban_end_km: 8
        land: {suburban: 0.3, cropland_south: 0.5, existing_corridor: 0.2}
        note: Ankeny's suburbs on the way in
      - from: des_moines
        to: omaha
        detour: 1.08
        urban_start_km: 6
        urban_end_km: 6
        floodplain: 0.1
        note: the Loess Hills drop to the Missouri at Council Bluffs
        bridges: [{name: Missouri River and floodplain, length_m: 1000}]
      - from: omaha
        to: lincoln
        urban_start_km: 6
        urban_end_km: 5
        floodplain: 0.12
        bridges: [{name: Platte River, length_m: 800}]
      - from: lincoln
        to: grand_island
        urban_start_km: 5
        floodplain: 0.1
        note: crosses to the Platte's north bank (Grand Island, Kearney, North Platte)
        bridges: [{name: Platte River, length_m: 800}]
      - from: grand_island
        to: kearney
        floodplain: 0.2
        note: Platte valley
      - from: kearney
        to: north_platte
        floodplain: 0.2
        note: Platte valley
      - from: north_platte
        to: den
        land: {cropland_central: 0.8, existing_corridor: 0.15, wetland: 0.05}
        floodplain: 0.05
        note: >
          High plains along I-76 (Sterling, Fort Morgan), climbing ~800 m to Denver over ~360 km;
          dryland wheat and range, priced as central Minnesota cropland
        bridges: [{name: South Platte River, length_m: 400}]
      - from: den
        to: denver
        detour: 1.15
        urban_start_km: 4
        urban_end_km: 12
        urban_tunnel: 0.3
        land: {suburban: 0.4, urban_core: 0.1, existing_corridor: 0.45, cropland_central: 0.05}
